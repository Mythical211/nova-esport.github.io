<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="40%"  stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0015" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%"  stop-color="#e9d5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-glow"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="blur-core"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <!-- Fond -->
  <rect width="340" height="80" fill="#0a0015" rx="6"/>

  <!-- Barre accent — x=12, loin de l'étoile -->
  <rect x="12" y="20" width="3" height="40" fill="#a855f7" rx="1.5"/>

  <!-- Étoile centrée à x=58 — branches les plus courtes finissent à x=58-18=40, loin de la barre -->
  <circle cx="58" cy="40" r="28" fill="url(#halo)"/>
  <g filter="url(#blur-glow)" opacity="0.55">
    <line x1="58" y1="6"  x2="58" y2="74" stroke="#c084fc" stroke-width="1.5"/>
    <line x1="24" y1="40" x2="92" y2="40" stroke="#c084fc" stroke-width="1.5"/>
    <line x1="34" y1="16" x2="82" y2="64" stroke="#a855f7" stroke-width="0.8"/>
    <line x1="82" y1="16" x2="34" y2="64" stroke="#a855f7" stroke-width="0.8"/>
  </g>
  <g opacity="0.9">
    <line x1="58" y1="8"  x2="58" y2="35" stroke="#e9d5ff" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="58" y1="45" x2="58" y2="72" stroke="#e9d5ff" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="26" y1="40" x2="51" y2="40" stroke="#e9d5ff" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="65" y1="40" x2="90" y2="40" stroke="#e9d5ff" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="36" y1="18" x2="51" y2="33" stroke="#c084fc" stroke-width="0.6" stroke-linecap="round" opacity="0.8"/>
    <line x1="65" y1="47" x2="80" y2="62" stroke="#c084fc" stroke-width="0.6" stroke-linecap="round" opacity="0.8"/>
    <line x1="80" y1="18" x2="65" y2="33" stroke="#c084fc" stroke-width="0.6" stroke-linecap="round" opacity="0.8"/>
    <line x1="36" y1="62" x2="51" y2="47" stroke="#c084fc" stroke-width="0.6" stroke-linecap="round" opacity="0.8"/>
  </g>
  <circle cx="58" cy="40" r="5" fill="url(#core)" filter="url(#blur-core)"/>
  <circle cx="58" cy="40" r="2" fill="#ffffff"/>

  <!-- NOVA -->
  <text x="104" y="48" font-family="'Arial Black','Impact',sans-serif" font-weight="900" font-size="30" letter-spacing="6" fill="#ffffff">NOVA</text>

  <!-- Séparateur -->
  <line x1="236" y1="26" x2="236" y2="54" stroke="#a855f7" stroke-width="1" opacity="0.5"/>

  <!-- ESPORT + tagline -->
  <text x="248" y="37" font-family="Arial,sans-serif" font-weight="700" font-size="9" letter-spacing="3" fill="#a855f7">ESPORT</text>
  <text x="248" y="53" font-family="Arial,sans-serif" font-weight="400" font-size="8" letter-spacing="0.5" fill="#e9d5ff" opacity="0.6">BORN IN STARLIGHT</text>
</svg>
